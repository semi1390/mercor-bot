name: Check Mercor

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay this a little)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab
    inputs:
      test_message:
        description: "Only send a test message to everyone (no job check)"
        type: boolean
        default: false

# Lets the job push seen.json / state.json back to the repo.
permissions:
  contents: write

# Never run two checks at the same time.
concurrency:
  group: mercor-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always start from the newest commit, so a run that waited in the queue
      # sees the seen.json saved by the run before it (prevents duplicate alerts).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          if [ "$TEST_MESSAGE" = "true" ]; then
            python main.py --test-telegram
          else
            python main.py
          fi

      - name: Save state to repo (only if changed)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in seen.json state.json last_run.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update bot state"
          # In case you edited config.yaml on GitHub while this was running:
          git pull --rebase
          git push
